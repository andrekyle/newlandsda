<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1600 500" width="1600" height="500"
     role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid slice">
  <title id="title">Newlands Seventh-day Adventist Church — About Us</title>
  <desc id="desc">About Us banner with the Newlands SDA logo and mission statement on the left, and a mountain lake landscape on the right.</desc>

  <defs>
    <!-- Brand colors -->
    <linearGradient id="leftBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#F5F2EA"/>
      <stop offset="1"   stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Photo-to-cream blend strip in the middle -->
    <linearGradient id="blend" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="1"    stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft sun glow that overlays the photo's right side -->
    <radialGradient id="sun" cx="0.85" cy="0.45" r="0.4">
      <stop offset="0"   stop-color="#FFE9B3" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#FFE9B3" stop-opacity="0.25"/>
      <stop offset="1"   stop-color="#FFE9B3" stop-opacity="0"/>
    </radialGradient>

    <!-- Embedded photo (right half). Replace the href to swap the picture. -->
    <pattern id="photo" patternUnits="userSpaceOnUse" x="700" y="0" width="900" height="500">
      <image x="0" y="0" width="900" height="500"
             preserveAspectRatio="xMidYMid slice"
             href="/about-photo.jpg" xlink:href="/about-photo.jpg"/>
    </pattern>

    <!-- The cream area's curved right edge -->
    <clipPath id="creamShape">
      <path d="M0,0 H780 C760,180 600,320 420,420 C300,480 160,500 0,500 Z"/>
    </clipPath>

    <!-- Wavy navy/gold ribbon at the bottom -->
    <path id="wavePath"
          d="M0,440 C260,400 520,520 820,470 C1100,425 1340,500 1600,460 L1600,500 L0,500 Z"/>

    <!-- Simplified SDA flame-and-book mark -->
    <symbol id="sdaMark" viewBox="0 0 120 120">
      <!-- Book base -->
      <path d="M10,86 L60,76 L110,86 L110,108 L60,98 L10,108 Z"
            fill="#1A2A52"/>
      <path d="M10,86 L60,76 L110,86" fill="none" stroke="#F7F3E8" stroke-width="2"/>
      <line x1="60" y1="76" x2="60" y2="98" stroke="#F7F3E8" stroke-width="2"/>
      <!-- Three flame tongues -->
      <path d="M60,74
               C46,60 50,42 60,30
               C56,46 70,52 70,66
               C70,70 66,73 60,74 Z"
            fill="#F7F3E8"/>
      <path d="M52,72
               C40,60 44,46 50,38
               C50,52 60,56 60,68
               C60,71 56,73 52,72 Z"
            fill="#F7F3E8" opacity="0.85"/>
      <path d="M68,72
               C80,60 76,46 70,38
               C70,52 60,56 60,68
               C60,71 64,73 68,72 Z"
            fill="#F7F3E8" opacity="0.85"/>
    </symbol>

    <!-- Small leaf separator under the title -->
    <symbol id="leaf" viewBox="0 0 24 24">
      <path d="M12,2 C16,8 18,12 12,22 C6,12 8,8 12,2 Z" fill="#C8A24A"/>
      <path d="M12,2 L12,22" stroke="#9B7C2C" stroke-width="1" fill="none"/>
    </symbol>
  </defs>

  <!-- ====== Right half: photo + sun glow ====== -->
  <rect x="0" y="0" width="1600" height="500" fill="url(#photo)"/>
  <rect x="0" y="0" width="1600" height="500" fill="url(#sun)"/>

  <!-- ====== Left half: cream panel with curved edge ====== -->
  <g clip-path="url(#creamShape)">
    <rect width="800" height="500" fill="url(#leftBg)"/>
    <!-- Soft blend strip into the photo -->
    <rect x="600" y="0" width="260" height="500" fill="url(#blend)"/>
  </g>

  <!-- ====== Top-left logo lockup ====== -->
  <use href="#sdaMark" x="80" y="60" width="84" height="84"/>
  <line x1="190" y1="68" x2="190" y2="138" stroke="#1A2A52" stroke-width="2"/>

  <text x="210" y="98"
        font-family="'Georgia','Times New Roman',serif"
        font-size="36" font-weight="700" letter-spacing="3"
        fill="#1A2A52">NEWLANDS</text>
  <text x="210" y="128"
        font-family="'Helvetica','Arial',sans-serif"
        font-size="16" font-weight="600" letter-spacing="3"
        fill="#1A2A52">SEVENTH-DAY ADVENTIST CHURCH</text>

  <!-- ====== "ABOUT" headline ====== -->
  <text x="80" y="270"
        font-family="'Georgia','Times New Roman',serif"
        font-size="160" font-weight="700" letter-spacing="4"
        fill="#1A2A52">ABOUT</text>

  <!-- ====== "Us" gold script overlapping ====== -->
  <text x="350" y="330"
        font-family="'Brush Script MT','Lucida Handwriting',cursive"
        font-size="120" font-style="italic" font-weight="400"
        fill="#C8A24A">Us</text>

  <!-- ====== Gold rule with leaf ornament ====== -->
  <line x1="80" y1="370" x2="640" y2="370" stroke="#C8A24A" stroke-width="2"/>
  <use href="#leaf" x="348" y="358" width="24" height="24"/>

  <!-- ====== Tagline ====== -->
  <text x="80" y="412"
        font-family="'Helvetica','Arial',sans-serif"
        font-size="22" font-weight="400" fill="#1A2A52">
    <tspan x="80" dy="0">We exist to glorify God by <tspan font-weight="700">connecting</tspan> people to Jesus,</tspan>
    <tspan x="80" dy="32"><tspan font-weight="700">growing</tspan> disciples, and <tspan font-weight="700">serving</tspan> our community.</tspan>
  </text>

  <!-- ====== Bottom wave: navy band + gold edge ====== -->
  <use href="#wavePath" fill="#1A2A52"/>
  <path d="M0,438 C260,398 520,518 820,468 C1100,423 1340,498 1600,458"
        fill="none" stroke="#C8A24A" stroke-width="4"/>
</svg>
